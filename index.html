<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/F.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/metaImg.png" />
    <meta property="og:site_name" content="SIK-K" />
    <meta property="og:locale" content="ko_KR" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Font Preload for Performance -->
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard Preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <!-- Google Fonts (Noto Serif) - 비동기 로드 -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Pretendard - 지연 로드 (media 속성 트릭) -->
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css"
        rel="stylesheet"
      />
    </noscript>
    <!--
      Notice the use of  in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Google tag (gtag.js) - defer로 변경하여 렌더링 차단 방지 -->
    <script
      defer
      src="https://www.googletagmanager.com/gtag/js?id=G-6SVNR2BWCJ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-6SVNR2BWCJ");
    </script>
    <meta name="google-site-verification" content="nYMDVkpanKdyPjr8vtSmrZLo2vjA393cynvQgcFFAZw" />
  </head>
  <body aria-hidden="false">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #2F2A24;
        transition: opacity 0.5s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-text {
        font-family: Pretendard, sans-serif;
        font-weight: 500;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 0.4em;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid rgba(255, 255, 255, 0.5);
        animation: typing 1.5s steps(20, end) forwards;
        animation-delay: 0.8s;
        width: 0;
      }
      @media (min-width: 768px) {
        .splash-text { font-size: 18px; }
      }
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
    <div id="splash-screen">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <p class="splash-text">WELCOME TO FL1P WORLD</p>
      </div>
    </div>
    <script>
      (function() {
        var isHome = window.location.pathname === "/";
        var hasSeenSplash = sessionStorage.getItem("hasSeenSplash");
        var splash = document.getElementById("splash-screen");
        
        if (!isHome || hasSeenSplash) {
          splash.style.display = "none";
        } else {
          sessionStorage.setItem("hasSeenSplash", "true");
          setTimeout(function() {
            splash.classList.add("fade-out");
          }, 2500);
          setTimeout(function() {
            splash.style.display = "none";
          }, 3000);
        }
      })();
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
